<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Login - Finaizen</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    input, select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
    }
    
    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 10px;
    }
    
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    .btn-quick {
      background: #f0f0f0;
      color: #333;
    }
    
    .btn-quick:hover {
      background: #e0e0e0;
    }
    
    #result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }
    
    .success {
      background: #d4edda;
      border: 2px solid #c3e6cb;
      color: #155724;
    }
    
    .error {
      background: #f8d7da;
      border: 2px solid #f5c6cb;
      color: #721c24;
    }
    
    .info {
      background: #d1ecf1;
      border: 2px solid #bee5eb;
      color: #0c5460;
    }
    
    pre {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      margin-top: 10px;
      font-size: 12px;
    }
    
    .quick-login {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    @media (max-width: 600px) {
      .quick-login {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Test Login</h1>
    <p class="subtitle">Prueba de autenticación con backend</p>
    
    <div class="quick-login">
      <button class="btn-quick" onclick="quickLogin('maria@example.com', 'maria123')">
        👩 María
      </button>
      <button class="btn-quick" onclick="quickLogin('carlos@example.com', 'carlos123')">
        👨 Carlos
      </button>
      <button class="btn-quick" onclick="quickLogin('admin@finaizen.com', 'admin123')">
        👑 Admin
      </button>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="ejemplo@correo.com"
          required
        >
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••"
          required
        >
      </div>
      
      <button type="submit" class="btn-login">
        🚀 Iniciar Sesión
      </button>
    </form>
    
    <div id="result"></div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';
    
    // Quick login buttons
    function quickLogin(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }
    
    // Show result
    function showResult(type, message, data = null) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = type;
      resultDiv.style.display = 'block';
      
      let html = `<strong>${message}</strong>`;
      
      if (data) {
        html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      }
      
      resultDiv.innerHTML = html;
    }
    
    // Handle form submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      showResult('info', '🔄 Conectando con backend...');
      
      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            correo: email,
            contraseña: password
          })
        });
        
        const result = await response.json();
        
        if (response.ok) {
          // Guardar token
          if (result.data && result.data.token) {
            localStorage.setItem('authToken', result.data.token);
          }
          
          showResult('success', '✅ Login Exitoso!', {
            usuario: result.data.user,
            token: result.data.token ? result.data.token.substring(0, 20) + '...' : 'No token',
            mensaje: result.message
          });
          
          // Probar endpoint /me
          setTimeout(async () => {
            try {
              const meResponse = await fetch(`${API_URL}/auth/me`, {
                headers: {
                  'Authorization': `Bearer ${result.data.token}`
                }
              });
              
              const meData = await meResponse.json();
              
              console.log('✅ Endpoint /auth/me:', meData);
              
            } catch (error) {
              console.error('❌ Error en /auth/me:', error);
            }
          }, 500);
          
        } else {
          showResult('error', '❌ Error en Login', {
            mensaje: result.message,
            status: response.status
          });
        }
        
      } catch (error) {
        showResult('error', '❌ Error de Conexión', {
          error: error.message,
          tip: 'Asegúrate de que el backend esté corriendo en http://localhost:5000'
        });
      }
    });
    
    // Test al cargar
    console.log('🎯 Test Login cargado');
    console.log('📍 API URL:', API_URL);
    console.log('👥 Usuarios disponibles:');
    console.log('  - maría@example.com / maria123');
    console.log('  - carlos@example.com / carlos123');
    console.log('  - admin@finaizen.com / admin123');
  </script>
</body>
</html>
